name: BakePlan checks
on:
  push:
    branches: ['feature/bakeplan-scaffold', 'feature/bakeplan-mvp-stabilization', 'feature/bakeplan-defense-evidence', 'feature/bakeplan-ui-polish', 'feature/ml-protocol-v3']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r backend/requirements.lock -r tools/requirements.lock
          npm.cmd ci
          npm.cmd --prefix frontend ci
          npx.cmd playwright install chromium
      - name: Backend and offline evaluation
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .\.venv\Scripts\python.exe -m ruff check backend tools
          .\.venv\Scripts\python.exe -m pytest backend/tests -q
          .\.venv\Scripts\python.exe -m unittest discover -s tools/tests -v
      - name: Frontend
        working-directory: frontend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm.cmd run lint
          npm.cmd run typecheck
          npm.cmd test
          npm.cmd run build
      - name: Browser flow and restart
        run: npm.cmd run test:e2e
      - name: Capture matching pre-polish UI baseline
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $baseline = Join-Path $env:RUNNER_TEMP 'bakeplan-ui-before'
          git worktree add --detach $baseline 756829475615d37d024b12e720d7cfc9338e4b68
          npm.cmd --prefix $baseline ci
          npm.cmd --prefix (Join-Path $baseline 'frontend') ci
          New-Item -ItemType Junction -Path (Join-Path $baseline '.venv') -Target (Resolve-Path .venv) | Out-Null
          $env:GITHUB_SHA = '756829475615d37d024b12e720d7cfc9338e4b68'
          Push-Location $baseline
          try {
            npx.cmd playwright test --config=playwright.screenshots.config.ts
          } finally {
            Pop-Location
          }
          $before = Join-Path (Get-Location) 'test-results/screenshots/before'
          New-Item -ItemType Directory -Force -Path $before | Out-Null
          Copy-Item -Path (Join-Path $baseline 'test-results/screenshots/*') -Destination $before -Recurse
      - name: Capture real synthetic UI evidence
        run: npx.cmd playwright test screenshots/capture.spec.ts screenshots/owner-ux.spec.ts --config=playwright.screenshots.config.ts
      - name: Record real synthetic procurement UI demonstration
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npx.cmd playwright test video/capture.spec.ts --config=playwright.video.config.ts --output=test-results/video-production
          npx.cmd playwright test video/cgz-capture.spec.ts --config=playwright.video.config.ts
      - name: Produce matching synthetic API replay evidence
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          .\.venv\Scripts\python.exe -m scripts.replay_demo --output-dir test-results/defense-replay
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakeplan-ui-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/screenshots/
            test-results/defense-replay/
            test-results/**/trace.zip
            test-results/**/error-context.md
          retention-days: 14
          if-no-files-found: warn
      - name: Upload real demo recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bakeplan-demo-video-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/video/**/evidence/
            test-results/video-production/**/evidence/
          retention-days: 14
          if-no-files-found: warn
  controlled-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify Linux snapshot, deployment, and replay contracts
        run: |
          python -m pip install -r backend/requirements.lock
          python -m ruff check scripts
          python -m pytest backend/tests/test_deployment.py backend/tests/test_demo_replay.py -q
      - name: Build and exercise isolated controlled demo
        run: bash scripts/test_containers.sh
